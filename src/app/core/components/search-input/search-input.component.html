<div class="w-full bg-white/20 dark:bg-gray-900/20 backdrop-blur-md border border-white/30 dark:border-gray-700/30 rounded-xl p-8 mb-10 shadow-lg">
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-6">
    <ng-container *ngFor="let field of fields">
      <div class="relative group">
        <ng-container *ngIf="field.type === 'text' || field.type === 'number'">
          <div class="flex items-center bg-white/30 dark:bg-gray-800/30 border border-white/20 dark:border-gray-700/20 rounded-lg p-3 focus-within:ring-2 focus-within:ring-blue-500 transition duration-300">
            <svg class="w-5 h-5 text-gray-500 dark:text-gray-400 mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12h4m-4 0h-4m0 0V8m0 4v4m-6 4h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            <input
              [type]="field.type"
              [placeholder]="field.placeholder"
              [(ngModel)]="values[field.key]"
              class="w-full bg-transparent focus:outline-none text-sm text-gray-900 dark:text-gray-100 placeholder-gray-500 dark:placeholder-gray-400"
            />
          </div>
        </ng-container>

        <ng-container *ngIf="field.type === 'select'">
          <div class="flex items-center bg-white/30 dark:bg-gray-800/30 border border-white/20 dark:border-gray-700/20 rounded-lg p-3 focus-within:ring-2 focus-within:ring-blue-500 transition duration-300">
            <svg class="w-5 h-5 text-gray-500 dark:text-gray-400 mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8l4 4-4 4m6-4h14" />
            </svg>
            <select [(ngModel)]="values[field.key]" class="w-full bg-transparent focus:outline-none text-sm text-gray-900 dark:text-gray-100 placeholder-gray-500 dark:placeholder-gray-400">
              <option value="">{{ field.placeholder }}</option>
              <option *ngFor="let opt of field.options" [value]="opt">{{ opt }}</option>
            </select>
          </div>
        </ng-container>
      </div>
    </ng-container>
  </div>

  <!-- Botones de acción -->
  <div class="flex justify-end gap-4">
    <button (click)="reset()" class="px-5 py-2 bg-gray-300 dark:bg-gray-700 text-gray-800 dark:text-gray-200 rounded-lg font-medium hover:bg-gray-400 dark:hover:bg-gray-600 transition">
      Limpiar
    </button>
    <button (click)="onSearch()" class="px-5 py-2 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 transition">
      Buscar
    </button>
  </div>
</div>
