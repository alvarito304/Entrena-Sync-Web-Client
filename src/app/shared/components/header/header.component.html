<header class="bg-black text-white relative">
  <div class="bg-gradient-to-r absolute inset-0 from-gray-900 to-black z-0"></div>
  <div class="mx-auto px-4 relative z-10 container">
    <!-- Navbar -->
    <nav
      class="fixed top-0 left-0 right-0 z-50 transition-all duration-300"
      [ngClass]="{ 'bg-black/10': isScrolled }"
    >
      <div
        class="md:flex-row items-center justify-between py-4 px-4 bg-black/5 flex flex-col backdrop-blur-sm transition-all duration-300"
      >
        <!-- Logo -->
        <div class="items-center flex space-x-2">
          <img
            alt="Logo"
            src="https://placehold.co/60x60?text=FLEX"
            class="h-10 w-10"
          />
          <span class="text-2xl font-bold tracking-wider">
            FLEX <span class="text-indigo-500">FIT</span>
          </span>
        </div>

        <!-- Desktop Menu -->
        <div class="md:block hidden">
          <div class="flex space-x-1">
            <a
              *ngFor="let link of navLinks"
              [routerLink]="link.path"
              routerLinkActive="active-menu"
              [routerLinkActiveOptions]="{ exact: true }"
              class="px-3 py-2 text-sm font-medium rounded hover:bg-gray-800 hover:text-indigo-400 transition-all duration-200"
            >
              {{ link.label }}
            </a>
          </div>
        </div>

        <!-- Mobile Menu Button -->
        <div class="items-center mt-4 md:mt-0 flex">
          <button
            (click)="toggleMobileMenu()"
            class="md:hidden ml-4 text-white"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-6 h-6"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16"
              />
            </svg>
          </button>
        </div>
      </div>
    </nav>

    <!-- Mobile Menu -->
    <div
      *ngIf="isMobileMenuOpen"
      @fadeInOut
      class="fixed inset-0 h-screen bg-gray-900 z-50 md:hidden transition duration-300 ease-in-out"
    >
      <div class="flex flex-col p-4 space-y-2 h-full">
        <!-- Close Button -->
        <div class="flex justify-end">
          <button (click)="toggleMobileMenu()" class="text-white">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-6 h-6"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>

        <!-- Menu Items -->
        <div class="flex flex-col space-y-2">
          <a
            *ngFor="let link of navLinks"
            [routerLink]="link.path"
            routerLinkActive="active-menu"
            [routerLinkActiveOptions]="{ exact: true }"
            class="px-3 py-2 text-sm font-medium rounded hover:bg-gray-800 hover:text-indigo-400 transition-all duration-200"
            (click)="toggleMobileMenu()"
          >
            {{ link.label }}
          </a>
        </div>
      </div>
    </div>
  </div>
</header>
