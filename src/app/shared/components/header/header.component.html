<header class="bg-black relative">
  <div class="bg-gradient-to-r absolute inset-0 from-gray-700 to-black z-0"></div>
  <div class="container mx-auto px-4 relative">
    <nav class="fixed top-0 left-0 right-0 z-50 transition-all duration-300" [ngClass]="{'bg-black/10': isScrolled}">

      <!-- Escritorio -->
      <div class="hidden xl:flex items-center justify-between py-4 px-6 bg-black/5 backdrop-blur-sm transition-all duration-300">
        <!-- Logo -->
        <div class="flex items-center space-x-2">
          <img alt="Logo" src="/pink_lightning_no_bg.png" class="h-10 w-10" />
          <span class="text-2xl font-bold tracking-wider">ENTRENA <span class="text-primary-500">SYNC</span></span>
        </div>
        <!-- Menú -->
        <div class="flex flex-1 justify-center">
          <div class="flex space-x-4 items-center">
            <a *ngFor="let link of navLinks"
               [routerLink]="link.path"
               routerLinkActive="bg-primary-500"
               [routerLinkActiveOptions]="{ exact: true }"
               class="px-3 py-2 text-sm font-medium rounded hover:bg-surface-600 hover:text-primary-400 transition-all duration-200">
              {{ link.label }}
            </a>
          </div>
        </div>

        <!-- Tema + Usuario -->
        <div class="flex items-center space-x-4">
          <p-button type="button"
                    (onClick)="toggleDarkMode()"
                    [rounded]="true"
                    [icon]="isDarkTheme() ? 'pi pi-moon' : 'pi pi-sun'"
                    severity="primary">
          </p-button>

          <ng-container *ngIf="(authService.isAuthenticated() | async); else loginDesktop">
            <div class="flex items-center space-x-4">
              <span class="text-m text-black-300 dark:white-slate-400 mr-3">{{ user?.username }}</span>
              <p-menu #menuDesktop [popup]="true" [model]="menuItems"></p-menu>
              <img
                alt="User profile picture"
                [src]="userPhotoUrl || 'https://placehold.co/40x40/indigo/white?text=' + getUserInitials()"
                class="w-10 h-10 rounded-full object-cover border-2 border-indigo-200 dark:border-indigo-800 shadow-lg cursor-pointer transition duration-300 ease-in-out hover:-translate-y-1"
                (click)="menuDesktop.toggle($event)" />
            </div>
          </ng-container>

          <ng-template #loginDesktop>
            <p-button label="Iniciar Sesión"
                      icon="pi pi-sign-in"
                      (onClick)="navigateToLogin()"
                      severity="primary"
                      [outlined]="true">
            </p-button>
          </ng-template>
        </div>
      </div>

        <!-- Móvil -->
      <div class="xl:hidden flex items-center justify-between py-4 px-4 bg-black/5 backdrop-blur-sm transition-all duration-300">
        <!-- Logo -->
        <div class="flex items-center space-x-2">
          <img alt="Logo" src="https://placehold.co/60x60?text=FLEX" class="h-10 w-10" />
          <span class="text-xl font-bold tracking-wider">ENTRENA <span class="text-primary-500">SYNC</span></span>
        </div>

        <div class="flex items-center space-x-3">
          <ng-container *ngIf="(authService.isAuthenticated() | async); else loginMobile">
            <p-menu #menuMobile [popup]="true" [model]="menuItems"></p-menu>
            <div class="relative">
              <img
                alt="User profile picture"
                [src]="userPhotoUrl || 'https://placehold.co/32x32/indigo/white?text=' + getUserInitials()"
                class="w-8 h-8 rounded-full object-cover border-2 border-indigo-200 dark:border-indigo-800 shadow-lg cursor-pointer"
                (click)="menuMobile.toggle($event)" />
            </div>
          </ng-container>

          <ng-template #loginMobile>
            <p-button icon="pi pi-sign-in"
                      (onClick)="navigateToLogin()"
                      severity="primary"
                      [rounded]="true"
                      [outlined]="true">
            </p-button>
          </ng-template>

          <p-button type="button"
                    (onClick)="toggleDarkMode()"
                    [rounded]="true"
                    [icon]="isDarkTheme() ? 'pi pi-moon' : 'pi pi-sun'"
                    severity="primary">
          </p-button>

          <button (click)="toggleMobileMenu()" class="text-white focus:outline-none">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-primary-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>
        </div>
      </div>

    </nav>
    <!-- ... el resto (menú móvil desplegable) se mantiene igual ... -->
  </div>
</header>
