<!-- Tabla genérica para usuarios -->
<generic-table
  [items]="combinedUsers"
  [cols]="cols"
  [globalFilterFields]="['email', 'firstName', 'lastName', 'address', 'phone', 'birthDate', 'gender'] "
  [title]="'Manage Users'"
  [entityName]="'Usuario'"
  [idField]="'id'"
  [nameField]="'email'"
  [severityMap]="{}"
  (onSave)="showEditDialog($event)"
  (onDelete)="deleteUser($event)"
  (onDeleteMultiple)="deleteSelectedUsers($event)"
>
  <ng-template #formTemplate let-user>
    <div class="p-fluid p-formgrid p-grid">
      <!-- Email -->
      <div class="p-field p-col-12">
        <label for="email" class="block font-bold mb-2">Email</label>
        <input
          id="email"
          type="text"
          pInputText
          [(ngModel)]="user.email"
          required
        />
      </div>
      <!-- Nombre -->
      <div class="p-field p-col-12">
        <label for="firstName" class="block font-bold mb-2">Nombre</label>
        <input
          id="firstName"
          pInputText
          [(ngModel)]="user.firstName"
          required
        />
      </div>
      <!-- Apellidos -->
      <div class="p-field p-col-6">
        <label for="lastName" class="block font-bold mb-2">Apellidos</label>
        <input
          id="lastName"
          pInputText
          [(ngModel)]="user.lastName"
          required
        />
      </div>
      <!-- Dirección -->
      <div class="p-field p-col-6">
        <label for="address" class="block font-bold mb-2">Dirección</label>
        <input
          id="address"
          pInputText
          [(ngModel)]="user.address"
          required
        />
      </div>
      <!-- Teléfono -->
      <div class="p-field p-col-6">
        <label for="phone" class="block font-bold mb-2">Teléfono</label>
        <input
          id="phone"
          type="text"
          pInputText
          [(ngModel)]="user.phone"
        />
      </div>
      <!-- Género -->
      <div class="p-field p-col-6">
        <label for="gender" class="block font-bold mb-2">Género</label>
        <p-dropdown
          id="gender"
          [options]="genders"
          optionLabel="label"
          optionValue="value"
          [(ngModel)]="user.gender"
          placeholder="Select one"
        ></p-dropdown>
      </div>
      <!-- Fecha de Nacimiento -->
      <div class="p-field p-col-12">
        <label class="block font-bold mb-2">Fecha de Nacimiento</label>
        <p-datepicker
          [(ngModel)]="user.birthDate"
          [showIcon]="true"
          [placeholder]="'Seleccionar fecha'"
          inputId="birthDate"
        ></p-datepicker>
      </div>
    </div>
  </ng-template>
</generic-table>

<!-- Diálogo para crear/editar usuarios -->
<p-dialog
  header="{{ isNew ? 'Crear Usuario' : 'Editar Usuario' }}"
  [(visible)]="displayDialog"
  [modal]="true"
  [style]="{ width: '40vw' }"
  [closeOnEscape]="true"
  (onHide)="hideDialog()"
>
  <div class="p-fluid p-formgrid p-grid" *ngIf="current">
    <ng-container
      *ngTemplateOutlet="formTemplate; context: { $implicit: current }"
    ></ng-container>
  </div>

  <p-footer>
    <button
      pButton
      label="Cancelar"
      icon="pi pi-times"
      (click)="hideDialog()"
      class="p-button-text"
    ></button>
    <button
      pButton
      label="Guardar"
      icon="pi pi-check"
      (click)="save()"
    ></button>
    </p-footer>
</p-dialog>
