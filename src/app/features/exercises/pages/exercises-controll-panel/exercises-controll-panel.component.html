<!-- Tu generic-table tal cual -->
<generic-table
  [items]="exercises"
  [cols]="cols"
  [globalFilterFields]="['name', 'bodyPart']"
  [title]="'Manage Exercises'"
  [entityName]="'exercises'"
  [idField]="'id'"
  [nameField]="'name'"
  [severityMap]="severityMap"
  (onSave)="showEditDialog($event)"
  (onDelete)="deleteExercise($event)"
  (onDeleteMultiple)="deleteSelectedExercises($event)"
  (onImportItems)="importExercises($event)"
>
  <ng-template #formTemplate let-exercise>
    <!-- safe-navigation en gifUrl -->
    <div *ngIf="exercise?.gifUrl">
      <img
        [src]="exercise.gifUrl"
        [alt]="exercise?.name"
        class="block m-auto pb-4"
        style="max-width:150px"
      />
    </div>
    <div class="p-fluid p-formgrid p-grid">
      <!-- Name -->
      <div class="p-field p-col-12">
        <label for="name" class="block font-bold mb-2">Name</label>
        <input
          id="name"
          type="text"
          pInputText
          [(ngModel)]="exercise.name"
          required
        />
      </div>
      <!-- Description -->
      <div class="p-field p-col-12">
        <label for="description" class="block font-bold mb-2">Description</label>
        <textarea
          id="description"
          pInputTextarea
          [(ngModel)]="exercise.description"
          rows="3"
        ></textarea>
      </div>
      <!-- Body Part -->
      <div class="p-field p-col-6">
        <label for="bodyPart" class="block font-bold mb-2">Body Part</label>
        <p-dropdown
          id="bodyPart"
          [options]="bodyPartOptions"
          optionLabel="label"
          optionValue="value"
          [(ngModel)]="exercise.bodyPart"
          placeholder="Select one"
        ></p-dropdown>
      </div>
      <!-- Muscle Group -->
      <div class="p-field p-col-6">
        <label for="muscleGroup" class="block font-bold mb-2">Muscle Group</label>
        <p-dropdown
          id="muscleGroup"
          [options]="muscleGroupOptions"
          optionLabel="label"
          optionValue="value"
          [(ngModel)]="exercise.muscleGroup"
          placeholder="Select one"
        ></p-dropdown>
      </div>
      <!-- Equipment -->
      <div class="p-field p-col-6">
        <label for="equipment" class="block font-bold mb-2">Equipment</label>
        <input
          id="equipment"
          type="text"
          pInputText
          [(ngModel)]="exercise.equipment"
        />
      </div>
      <!-- Calories Burned -->
      <div class="p-field p-col-6">
        <label for="caloriesBurned" class="block font-bold mb-2">Calories Burned</label>
        <p-inputNumber
          id="caloriesBurned"
          [(ngModel)]="exercise.caloriesBurned"
          [min]="0"
        ></p-inputNumber>
      </div>
      <!-- Difficulty -->
      <div class="p-field p-col-6">
        <label for="difficulty" class="block font-bold mb-2">Difficulty</label>
        <p-dropdown
          id="difficulty"
          [options]="difficultyOptions"
          optionLabel="label"
          optionValue="value"
          [(ngModel)]="exercise.difficulty"
          placeholder="Select one"
        ></p-dropdown>
      </div>
      <!-- Video URL -->
      <div class="p-field p-col-6">
        <label for="videoUrl" class="block font-bold mb-2">Video URL</label>
        <input
          id="videoUrl"
          type="text"
          pInputText
          [(ngModel)]="exercise.videoUrl"
        />
      </div>
      <!-- File Upload -->
      <div class="p-field p-col-12">
        <label class="block font-bold mb-2">Image (optional)</label>
        <p-fileUpload
          name="file"
          customUpload="true"
          [auto]="true"
          (uploadHandler)="onFileSelect($event)"
          chooseLabel="Seleccionar"
          uploadLabel="Subir"
          cancelLabel="Cancelar"
        ></p-fileUpload>
      </div>
    </div>
  </ng-template>
</generic-table>

<!-- Diálogo de creación/edición -->
<p-dialog
  header="{{ isNew ? 'Crear Ejercicio' : 'Editar Ejercicio' }}"
  [(visible)]="displayDialog"
  [modal]="true"
  [style]="{ width: '50vw' }"
  [closeOnEscape]="true"
  (onHide)="hideDialog()"
>
  <!-- Sólo renderiza si `current` está inicializado -->
  <div class="p-fluid p-formgrid p-grid" *ngIf="current">
    <ng-container
      *ngTemplateOutlet="formTemplate; context: { $implicit: current }"
    ></ng-container>
  </div>

  <p-footer>
    <button
      pButton
      label="Cancelar"
      icon="pi pi-times"
      (click)="hideDialog()"
      class="p-button-text"
    ></button>
    <button
      pButton
      label="Guardar"
      icon="pi pi-check"
      (click)="save()"
      [disabled]="!current?.name"
    ></button>
  </p-footer>
</p-dialog>
