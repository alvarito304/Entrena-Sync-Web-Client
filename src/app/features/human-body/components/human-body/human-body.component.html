<div class="sc-body-model h-300-px">
  <app-men-body-svg (pieceClick)="handlePieceClick($event)"></app-men-body-svg>
  <app-men-back-body-svg (pieceClick)="handlePieceClick($event)"></app-men-back-body-svg>
</div>

<div class="search-bar">
  <input
    type="text"
    placeholder="Buscar ejercicio por nombre…"
    [(ngModel)]="searchName"
    (ngModelChange)="onSearchName()"
  />
</div>


<!-- buscador y SVG igual que antes … -->

<ng-container *ngIf="exercises$ | async as pageData">    <!-- comparte pageData -->
  <app-exercise-list [exercises]="pageData.exercises" [area]="area$ | async"></app-exercise-list>

  <app-pagination
    [page]="page$.value"
    [rows]="pageSize"
    [totalRecords]="pageData.totalElements"
    [links]="pageData.links"
    (pageChange)="page$.next($event)"
  ></app-pagination>
</ng-container>
